<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飲食選擇障礙輪盤</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
        }

        /* 3D Button Styles */
        .btn-3d {
            transition: all 0.1s;
            box-shadow: 0px 8px 0px 0px #b91c1c; /* dark red */
        }
        .btn-3d:active {
            transform: translateY(8px);
            box-shadow: 0px 0px 0px 0px #b91c1c;
        }

        .btn-3d-blue {
            box-shadow: 0px 6px 0px 0px #1d4ed8;
        }
        .btn-3d-blue:active {
            transform: translateY(6px);
            box-shadow: 0px 0px 0px 0px #1d4ed8;
        }
        
        .btn-3d-red {
            box-shadow: 0px 4px 0px 0px #7f1d1d;
        }
        .btn-3d-red:active {
            transform: translateY(4px);
            box-shadow: 0px 0px 0px 0px #7f1d1d;
        }

        /* Wheel container to overlay indicator */
        .wheel-container {
            position: relative;
            display: inline-block;
        }
        .wheel-indicator {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ef4444;
            z-index: 10;
            filter: drop-shadow(0px 4px 2px rgba(0,0,0,0.3));
        }

        /* Modal Animation */
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-content {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center justify-center">

    <header class="text-center mb-8">
        <h1 class="text-4xl md:text-5xl font-black text-white drop-shadow-md mb-2">🍕 飲食選擇障礙輪盤 🍣</h1>
        <p class="text-lg text-red-800 font-bold">不知道吃什麼？交給命運決定吧！</p>
    </header>

    <main class="w-full max-w-5xl bg-white/60 backdrop-blur-md rounded-3xl shadow-2xl p-6 md:p-10 flex flex-col md:flex-row gap-10">
        
        <!-- Left: Wheel Area -->
        <section class="flex-1 flex flex-col items-center justify-center">
            <div class="wheel-container mb-8">
                <div class="wheel-indicator"></div>
                <canvas id="wheelCanvas" width="400" height="400" class="rounded-full shadow-lg max-w-full h-auto"></canvas>
            </div>
            <button id="spinBtn" class="btn-3d bg-red-500 hover:bg-red-400 text-white font-black text-3xl py-4 px-12 rounded-full w-full max-w-xs uppercase tracking-wider">
                抽 獎 !
            </button>
        </section>

        <!-- Right: List Management -->
        <section class="flex-1 flex flex-col">
            <h2 class="text-2xl font-bold text-gray-800 mb-4 border-b-4 border-yellow-400 pb-2 inline-block">📝 候選名單</h2>
            
            <div class="flex gap-2 mb-6">
                <input type="text" id="foodInput" placeholder="輸入想吃的食物..." class="flex-1 px-4 py-3 rounded-xl border-2 border-gray-300 focus:outline-none focus:border-blue-500 text-lg font-bold">
                <button id="addBtn" class="btn-3d-blue bg-blue-500 hover:bg-blue-400 text-white font-bold py-3 px-6 rounded-xl text-lg">
                    新增
                </button>
            </div>

            <div class="bg-white rounded-2xl shadow-inner p-4 flex-1 min-h-[200px] max-h-[350px] overflow-y-auto">
                <ul id="foodList" class="space-y-3">
                    <!-- List items generated by JS -->
                </ul>
            </div>
            
            <p class="text-gray-500 text-sm mt-3 text-center font-bold" id="itemCountMsg"></p>
        </section>

    </main>

    <!-- Flashy Result Modal -->
    <div id="resultModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-40">
        <div class="modal-content bg-white rounded-3xl p-8 max-w-sm w-full mx-4 text-center shadow-2xl relative border-8 border-yellow-400">
            <h3 class="text-2xl font-bold text-gray-500 mb-2">命運的安排是...</h3>
            <p id="resultText" class="text-5xl font-black text-red-600 mb-8 drop-shadow-md my-6"></p>
            <button id="closeModalBtn" class="btn-3d-blue bg-blue-500 hover:bg-blue-400 text-white font-bold py-3 px-8 rounded-full text-xl w-full">
                太棒了！
            </button>
        </div>
    </div>

    <!-- Confetti Canvas overlay -->
    <canvas id="confetti-canvas"></canvas>

    <script>
        // State: 預設常見的餐點選項
        let items = ["拉麵 🍜", "火鍋 🍲", "麥當勞 🍔", "牛排 🥩", "壽司 🍣", "便當 🍱"];
        const colors = [
            '#FF595E', '#FFCA3A', '#8AC926', '#1982C4', '#6A4C93', '#F15BB5',
            '#00BBF9', '#00F5D4', '#FEE440', '#9B5DE5'
        ];

        // Elements
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const foodInput = document.getElementById('foodInput');
        const addBtn = document.getElementById('addBtn');
        const foodList = document.getElementById('foodList');
        const itemCountMsg = document.getElementById('itemCountMsg');
        
        const resultModal = document.getElementById('resultModal');
        const resultText = document.getElementById('resultText');
        const closeModalBtn = document.getElementById('closeModalBtn');

        // Wheel Physics State
        let currentAngle = 0;
        let isSpinning = false;
        let spinVelocity = 0;
        let animationFrameId;

        // Render List
        function updateList() {
            foodList.innerHTML = '';
            items.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center bg-gray-100 p-3 rounded-lg border-2 border-transparent hover:border-gray-300 transition';
                
                const span = document.createElement('span');
                span.className = 'font-bold text-lg text-gray-700';
                span.textContent = item;
                
                const delBtn = document.createElement('button');
                delBtn.className = 'btn-3d-red bg-red-500 hover:bg-red-400 text-white font-bold px-3 py-1 rounded-lg text-sm';
                delBtn.textContent = '刪除';
                delBtn.onclick = () => {
                    if(isSpinning) return;
                    items.splice(index, 1);
                    updateList();
                    drawWheel();
                };

                li.appendChild(span);
                li.appendChild(delBtn);
                foodList.appendChild(li);
            });
            
            itemCountMsg.textContent = `共 ${items.length} 個選項 (至少需要 2 個)`;
        }

        // Add Item
        addBtn.addEventListener('click', () => {
            if(isSpinning) return;
            const val = foodInput.value.trim();
            if(val) {
                items.push(val);
                foodInput.value = '';
                updateList();
                drawWheel();
            }
        });
        foodInput.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') addBtn.click();
        });

        // Draw Wheel
        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if(items.length === 0) return;

            const arcSize = (2 * Math.PI) / items.length;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = centerX;

            for(let i = 0; i < items.length; i++) {
                const angle = currentAngle + i * arcSize;
                
                // Draw slice
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
                ctx.fill();
                
                // Add border
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#ffffff";
                ctx.stroke();

                // Draw text
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                ctx.font = "bold 20px Nunito, sans-serif";
                
                // Shadow for text
                ctx.shadowColor = "rgba(0,0,0,0.5)";
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;
                
                ctx.fillText(items[i], radius - 20, 8);
                ctx.restore();
            }
        }

        // Spin Logic
        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;
            if (items.length < 2) {
                // simple custom alert fallback if they somehow get here
                resultText.textContent = "請至少輸入2個選項！";
                resultModal.classList.remove('hidden');
                resultModal.classList.add('flex');
                return;
            }

            isSpinning = true;
            spinBtn.classList.add('opacity-50', 'cursor-not-allowed');
            
            // Random spin velocity (initial speed)
            spinVelocity = Math.random() * 0.2 + 0.4; 
            
            animateSpin();
        });

        function animateSpin() {
            currentAngle += spinVelocity;
            
            // Friction/Deceleration
            spinVelocity *= 0.985; 

            drawWheel();

            if (spinVelocity > 0.002) {
                animationFrameId = requestAnimationFrame(animateSpin);
            } else {
                // Stop spinning
                isSpinning = false;
                spinVelocity = 0;
                spinBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                determineResult();
            }
        }

        function determineResult() {
            // Adjust angle to find the winning slice (top indicator is at 270 deg or -PI/2)
            const arcSize = (2 * Math.PI) / items.length;
            
            // Normalize current angle
            let normalizedAngle = currentAngle % (2 * Math.PI);
            if (normalizedAngle < 0) normalizedAngle += 2 * Math.PI;

            // The indicator is at the top (which is 270 degrees or 1.5 PI in standard canvas coordinates)
            // But we draw starting from 0 (right). 
            // We need to calculate which slice is currently under the top indicator.
            const offset = (3 * Math.PI / 2) - normalizedAngle;
            let finalOffset = offset % (2 * Math.PI);
            if (finalOffset < 0) finalOffset += 2 * Math.PI;

            const winningIndex = Math.floor(finalOffset / arcSize);
            const winner = items[winningIndex];

            showResult(winner);
        }

        // Modal & Confetti
        function showResult(winner) {
            resultText.textContent = winner;
            resultModal.classList.remove('hidden');
            resultModal.classList.add('flex');
            fireConfetti();
        }

        closeModalBtn.addEventListener('click', () => {
            resultModal.classList.add('hidden');
            resultModal.classList.remove('flex');
            stopConfetti();
        });

        // Simple Confetti System
        const confettiCanvas = document.getElementById('confetti-canvas');
        const cCtx = confettiCanvas.getContext('2d');
        let confettis = [];
        let confettiInterval;

        function resizeConfetti() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', () => {
            resizeConfetti();
            drawWheel();
        });
        resizeConfetti();

        class Confetti {
            constructor() {
                this.x = Math.random() * confettiCanvas.width;
                this.y = Math.random() * confettiCanvas.height - confettiCanvas.height;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.size = Math.random() * 10 + 5;
                this.speedY = Math.random() * 3 + 2;
                this.speedX = Math.random() * 2 - 1;
                this.angle = Math.random() * 360;
                this.spin = Math.random() * 0.2 - 0.1;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.angle += this.spin;
                if (this.y > confettiCanvas.height) {
                    this.y = -10;
                    this.x = Math.random() * confettiCanvas.width;
                }
            }
            draw() {
                cCtx.save();
                cCtx.translate(this.x, this.y);
                cCtx.rotate(this.angle);
                cCtx.fillStyle = this.color;
                cCtx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                cCtx.restore();
            }
        }

        function fireConfetti() {
            confettis = [];
            for (let i = 0; i < 150; i++) {
                confettis.push(new Confetti());
            }
            if(!confettiInterval) {
                confettiInterval = requestAnimationFrame(renderConfetti);
            }
        }

        function renderConfetti() {
            cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            confettis.forEach(c => {
                c.update();
                c.draw();
            });
            if(confettis.length > 0) {
                confettiInterval = requestAnimationFrame(renderConfetti);
            }
        }

        function stopConfetti() {
            confettis = [];
            cancelAnimationFrame(confettiInterval);
            confettiInterval = null;
            cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        }

        // Initialize
        updateList();
        drawWheel();
    </script>
</body>
</html>
